# Publishes a Windows release by itself.
# Whenever main changes, this checks the version in desktop/package.json. If there is no GitHub release for it yet,
# it builds the Setup .exe and the Portable .exe on a Windows runner, writes latest.json (which installed copies read
# to update themselves), creates the tag v<version> and publishes the release with the notes from CHANGELOG.md.
#
# To publish a version: raise "version" in desktop/package.json (and in app/account.js), add a "## <version>" section
# to CHANGELOG.md, and push to main. Nothing else.
# To rebuild a release that already exists: Actions → Windows release → Run workflow.
name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; echo "Rebuilding v$V on request"; exit 0; fi
          N=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$N" -ge 3 ]; then echo "build=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released ($N files) — nothing to do"; else echo "build=true" >> "$GITHUB_OUTPUT"; echo "v$V has no release yet — building"; fi
  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the web app
        shell: bash
        run: |
          python build.py
          mkdir -p desktop/app
          cp dist/index.html desktop/app/index.html
      - name: Build the installer and the portable app
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis portable --x64 --publish never
          node build/latest-json.js "HelixBoard $VERSION"
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const v=process.env.VERSION;const i=s.indexOf('## '+v);if(i<0){console.log('HelixBoard '+v);process.exit(0)}const r=s.slice(i+('## '+v).length);const j=r.search(/\n## /);console.log((j<0?r:r.slice(0,j)).trim())" > notes.md
      - name: Publish the release
        shell: bash
        run: |
          S="desktop/release/HelixBoard-By-Mr-Hany-Taha-Setup-$VERSION.exe"
          P="desktop/release/HelixBoard-By-Mr-Hany-Taha-Portable-$VERSION.exe"
          J="desktop/release/latest.json"
          ls -la desktop/release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$S" "$P" "$J" --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$S" "$P" "$J" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
          fi
