<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A14">
<title>__TITLE__ · HelixBoard quiz</title>
<style>
  :root { --bg:#120A14; --panel:#1C1220; --panel2:#271A2C; --line:#3A2840; --ink:#F6ECF4; --muted:#B9A5B6; --accent:#FF5FA2; --ok:#4ADE80; --bad:#FF6B6B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(900px 500px at 50% -10%, #3A1530, var(--bg)); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(28,18,32,.8); }
  header b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sc { font: 800 18px ui-monospace, Consolas, monospace; color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; }
  .center { margin: auto 0; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 6px; } h2 { font-size: 22px; margin: 0; line-height: 1.3; }
  .muted { color: var(--muted); }
  input { width: 100%; height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: inherit; font: 600 20px system-ui, sans-serif; padding: 0 14px; margin: 6px 0; text-align: center; }
  input:focus { outline: none; border-color: var(--accent); }
  button.go { width: 100%; height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: #24020F; font: 800 20px system-ui, sans-serif; margin-top: 8px; }
  button.go:disabled { opacity: .5; }
  .err { color: var(--bad); min-height: 22px; margin-top: 6px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
  .opts.many { grid-template-columns: 1fr; }
  .opt { border: 0; border-radius: 18px; color: #1E1419; font: 700 18px system-ui, sans-serif; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 110px; text-align: center; transition: transform .1s, opacity .2s; }
  .opt:active { transform: scale(.97); }
  .opt .lt { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.55); display: grid; place-items: center; font-size: 22px; font-weight: 900; }
  .opt.dim { opacity: .3; } .opt.right { outline: 5px solid var(--ok); outline-offset: 2px; } .opt.mine { outline: 5px solid #fff; outline-offset: 2px; }
  .bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
  .big { font: 900 64px system-ui, sans-serif; } .res { border-radius: 20px; padding: 24px 16px; text-align: center; } .res.ok { background: #1F5133; } .res.no { background: #5A1E28; } .res.poll { background: var(--panel2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .dots { display: inline-flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: b 1.2s infinite; } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .tm { padding: 3px 10px; border-radius: 999px; font: 800 13px system-ui, sans-serif; color: #1E1419; white-space: nowrap; }
  .pws { display: flex; gap: 8px; flex-wrap: wrap; } .pw { flex: 1; min-width: 90px; height: 46px; border-radius: 12px; border: 2px solid #FFC928; background: rgba(255,201,40,.12); color: var(--ink); font: 800 15px system-ui, sans-serif; }
  .pw.used { background: #FFC928; color: #1E1419; } .pw:disabled { opacity: .45; }
  .conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .conf button { height: 70px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); font: 800 16px system-ui, sans-serif; }
  .ord { display: flex; flex-direction: column; gap: 8px; } .it { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--panel2); border: 2px solid var(--line); font: 700 17px system-ui, sans-serif; touch-action: none; user-select: none; }
  .it .n { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #24020F; display: grid; place-items: center; font-weight: 900; flex: none; }
  .it .tx { flex: 1; } .it button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--panel); color: var(--ink); font-size: 18px; } .it.drag { opacity: .85; border-color: var(--accent); transform: scale(1.02); } .it.ok { border-color: var(--ok); } .it.no { border-color: var(--bad); }
  .hp { height: 10px; border-radius: 5px; background: #3a1520; overflow: hidden; } .hp i { display: block; height: 100%; background: linear-gradient(90deg, #ff3b5c, #ff9f5a); transition: width .5s; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px; }
</style>
</head>
<body>
<header><b id="hd">__TITLE__</b><span id="tm"></span><span class="sc" id="sc"></span></header>
<main id="m"></main>
<footer>HelixBoard By Mr. Hany Taha</footer>
<script>
(() => {

  /* Arabic when the teacher's app is in Arabic */
  const LANG = document.documentElement.lang === 'ar' ? 'ar' : 'en', AR = {"Join the quiz": "انضم إلى الاختبار", "Write your first and last name so your teacher knows who you are.": "اكتب اسمك الأول واسم عائلتك ليعرفك معلمك.", "Your full name": "اسمك الكامل", "Game PIN": "رمز اللعبة", "Join": "انضمام", "Cannot reach the board — are you on the school Wi-Fi?": "تعذّر الوصول إلى السبورة — هل أنت على شبكة المدرسة؟", "Could not join.": "تعذّر الانضمام.", "Please join again.": "يرجى الانضمام مرة أخرى.", "Reconnecting…": "جارٍ إعادة الاتصال…", "Connection lost — still trying. If this lasts, scan the QR code on the board again.": "انقطع الاتصال — ما زلنا نحاول. إذا استمر ذلك، امسح رمز QR على السبورة مرة أخرى.", "The quiz has finished": "انتهى الاختبار", "Thanks for playing!": "شكراً لمشاركتك!", "Back to class": "العودة إلى الصف", "Joining the quiz…": "جارٍ الانضمام إلى الاختبار…", "You’re in,": "أنت معنا،", "Your team:": "فريقك:", "🦠 Boss battle — every right answer damages the boss. Beat it together!": "🦠 معركة الزعيم — كل إجابة صحيحة تُضعف الزعيم. اهزموه معاً!", "⚡ Get 2 in a row to earn power-ups.": "⚡ أجب إجابتين صحيحتين متتاليتين لتربح قوة خاصة.", "Look at the board — the quiz starts soon.": "انظر إلى السبورة — سيبدأ الاختبار قريباً.", "Question": "السؤال", "of": "من", "Answer locked in — wait for the reveal.": "تم تثبيت إجابتك — انتظر إظهار الإجابة.", "No answer": "لا توجد إجابة", "Thanks for voting!": "شكراً لتصويتك!", "No answer this time": "لم تُجب هذه المرة", "You are": "أنت", "Thanks!": "شكراً!", "Time’s up": "انتهى الوقت", "Next question": "السؤال التالي", "See my result": "عرض نتيجتي", "All done!": "انتهيت!", "correct": "صحيحة", "points": "نقطة", "so far — wait for the final results on the board.": "حتى الآن — انتظر النتائج النهائية على السبورة.", "The class defeated the boss!": "هزم الصف الزعيم!", "The boss escaped — next time!": "هرب الزعيم — في المرة القادمة!", "team": "فريق", "place": "المركز", "Well done,": "أحسنت،", "You chose": "اخترت", "your order": "ترتيبك", "How sure are you?": "ما مدى ثقتك؟", "Guessing": "أخمّن", "Think so": "أظن ذلك", "Sure": "متأكد", "Sure and right = more points. Sure and wrong = lose a few.": "متأكد ومصيب = نقاط أكثر. متأكد ومخطئ = تخسر قليلاً.", "Change my answer": "غيّر إجابتي", "Boss": "الزعيم", "Double points": "نقاط مضاعفة", "50/50": "50/50", "Time freeze": "إيقاف الوقت", "Streak shield": "درع السلسلة", "on": "مفعّل", "Correct!": "صحيح!", "in a row": "متتالية", "double points!": "نقاط مضاعفة!", "New power-up:": "قوة خاصة جديدة:", "Not this time": "ليس هذه المرة", "You were sure — check the answer below carefully.": "كنت متأكداً — راجع الإجابة أدناه جيداً.", "Your streak is safe": "سلسلتك محفوظة", "The right order": "الترتيب الصحيح", "The answer": "الإجابة", "Submit my order": "أرسل ترتيبي", "pts": "نقطة", "Waiting…": "انتظار…"};
  const t = k => LANG === 'ar' && AR[k] || k; if (LANG === 'ar') document.documentElement.dir = 'rtl';
  const m = document.getElementById('m'), q = new URLSearchParams(location.search);
  const pin = q.get('pin') || '', autoName = q.get('auto') ? (q.get('name') || '').slice(0, 40) : '', backQ = q.get('back') || '', back = /^\/(?!\/)/.test(backQ) ? backQ : '';
  const goBack = () => { try { sessionStorage.setItem('hbq-left', pin); } catch (e) {} location.href = back; };
  const key = 'hbq:' + pin;
  let pid = null, timer = 0, view = null;
  try { pid = localStorage.getItem(key); } catch (e) {}
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); Object.entries(attrs || {}).forEach(([k, v]) => v == null ? 0 : k === 'class' ? e.className = v : k.startsWith('on') ? e[k] = v : e.setAttribute(k, v)); kids.flat().forEach(k => e.append(k && k.nodeType ? k : document.createTextNode(k == null ? '' : String(k)))); return e; };
  const set = (...kids) => { m.replaceChildren(...kids); };
  const post = (p, d) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).then(r => r.json().then(j => ({ ok: r.ok, j })));

  function joinScreen(msg) {
    const name = el('input', { maxlength: '40', placeholder: t('Your full name'), autocomplete: 'off', autocapitalize: 'words' }); if (autoName) name.value = autoName;
    const pinIn = el('input', { inputmode: 'numeric', maxlength: '6', placeholder: t('Game PIN') }); pinIn.value = pin;
    const err = el('div', { class: 'err' }, msg || '');
    const go = el('button', { class: 'go' }, t('Join'));

    set(el('div', { class: 'center' }, el('h1', {}, t('Join the quiz')), el('p', { class: 'muted' }, t('Write your first and last name so your teacher knows who you are.')), pin ? '' : pinIn, name, go, err));

  }

  /* long-polling: one request waits on the board until something changes; works on Wi-Fi, mobile data and through the internet link */
  let ver = 0, loopId = 0;
  function connect() {

        } catch (e) { fails++; /* the board stopped the game after the final results */ if (view && view.v === 'end' && fails > 2) { hideOffline(); render({ v: 'closed' }); return; } if (fails > 2) showOffline(fails > 10); await new Promise(r => setTimeout(r, Math.min(5000, 800 * fails))); }
      } })();
  }
  const off = el('div', { style: 'position:fixed;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:12px;background:#5A1E28;color:#fff;text-align:center;font-weight:600;display:none' }, t('Reconnecting…')); document.body.append(off);
  const showOffline = long => { off.textContent = long ? t('Connection lost — still trying. If this lasts, scan the QR code on the board again.') : t('Reconnecting…'); off.style.display = 'block'; }, hideOffline = () => off.style.display = 'none';

  function render(d) {
    clearInterval(timer); view = d;
    if (d.v === 'closed') { try { localStorage.removeItem(key); } catch (e) {} set(el('div', { class: 'center' }, el('h1', {}, t('The quiz has finished')), el('p', { class: 'muted' }, t('Thanks for playing!')), back ? el('button', { class: 'go', onclick: goBack }, t('Back to class')) : '')); if (back) setTimeout(goBack, 2500); return; }
    document.getElementById('sc').textContent = d.score != null ? d.score + ' ' + t('pts') : '';
    const tm = document.getElementById('tm'); tm.replaceChildren(d.team ? el('span', { class: 'tm', style: 'background:' + d.team.color }, d.team.emoji + ' ' + d.team.name) : '');
    if (d.v === 'lobby') return set(el('div', { class: 'center' }, el('h1', {}, t('You’re in,') + ' ' + d.name + '!'), d.team ? el('p', {}, el('span', { class: 'tm', style: 'background:' + d.team.color + ';font-size:16px;padding:6px 14px' }, t('Your team:') + ' ' + d.team.emoji + ' ' + d.team.name)) : '', d.mode === 'boss' ? el('p', {}, t('🦠 Boss battle — every right answer damages the boss. Beat it together!')) : '', d.pw ? el('p', { class: 'muted' }, t('⚡ Get 2 in a row to earn power-ups.')) : '', el('p', { class: 'muted' }, t('Look at the board — the quiz starts soon.')), el('div', { class: 'dots' }, el('i'), el('i'), el('i'))));
    if (d.v === 'question') {
      const bar = el('i', { style: 'width:100%' });
      const head = el('div', {}, el('div', { class: 'muted' }, t('Question') + ' ' + (d.qi + 1) + ' ' + t('of') + ' ' + d.total), el('h2', {}, d.q));
      const done = d.answered != null, hide = d.hide || [];
      let opts;
      if (pending != null && pending.qi === d.qi && !done) opts = confBox(d);
      else if (d.t === 'order') opts = orderList(d, done);
      else opts = el('div', { class: 'opts' + (d.o.length > 4 || d.o.some(o => o.length > 40) ? ' many' : '') }, d.o.map((o, k) => el('button', { class: 'opt' + (done ? (k === d.answered ? ' mine' : ' dim') : hide.includes(k) ? ' dim' : ''), style: 'background:' + C[k] + (hide.includes(k) ? ';visibility:hidden' : ''), onclick: () => pick(k) }, el('span', { class: 'lt' }, L[k]), o)));
      set(head, d.boss ? bossBar(d.boss) : '', d.limit ? el('div', { class: 'bar' }, bar) : '', powers(d, done), opts, done ? el('p', { class: 'muted center', style: 'margin:0' }, t('Answer locked in — wait for the reveal.')) : '');
      if (d.limit) { const end = Date.now() + d.left * 1000; const tick = () => { const left = Math.max(0, end - Date.now()); bar.style.width = (left / (d.limit * 1000) * 100) + '%'; if (!left) { clearInterval(timer); if (pending && pending.qi === d.qi) { sendAnswer(pending.c, 1); return; } /* student-paced: time is up, move on */ if (d.self && view === d && d.answered == null) pick(-1); } }; tick(); timer = setInterval(tick, 200); }
      return;
    }
    if (d.v === 'reveal' || d.v === 'selfres') pending = null;
    if (d.v === 'reveal') {
      const r = d.last || {}; const poll = d.a < 0 && !d.order;
      const box = poll ? el('div', { class: 'res poll' }, el('h2', {}, d.mine == null ? t('No answer') : t('Thanks for voting!'))) : d.mine == null ? el('div', { class: 'res no' }, el('div', { class: 'big' }, '⏱'), el('h2', {}, t('No answer this time'))) : resBox(r);
      return set(d.boss ? bossBar(d.boss) : '', box, poll ? '' : rightCard(d), d.rank ? el('p', { class: 'center muted', style: 'margin:0' }, t('You are') + ' ' + ordinal(d.rank) + ' ' + t('of') + ' ' + d.players) : '');
    }
    if (d.v === 'selfres') {
      const r = d.last || {}, poll = d.a < 0 && !d.order;
      const box = poll ? el('div', { class: 'res poll' }, el('h2', {}, t('Thanks!'))) : d.mine == null || d.mine === -1 ? el('div', { class: 'res no' }, el('div', { class: 'big' }, '⏱'), el('h2', {}, t('Time’s up'))) : resBox(r);

  }
  /* with "How sure are you?" on, the answer waits for the confidence choice */
  let pending = null;
  function pick(k) {

  }
  async function sendAnswer(c, conf) {
    if (!view || view.v !== 'question' || view.answered != null) return;
    pending = null; view.answered = c; if (c !== -1) render(view);
    try { const r = await post('answer', { pid, qi: view.qi, c, conf }); if (!r.ok && r.j.error) { const p = el('p', { class: 'err center' }, r.j.error); m.append(p); } } catch (e) {}
  }
  function confBox(d) { const k = pending.c, chosen = d.t === 'order' ? t('your order') : L[k] + ') ' + d.o[k];
    return el('div', { class: 'card' }, el('div', { class: 'muted' }, t('You chose')), el('b', {}, chosen), el('h2', { style: 'margin:14px 0 10px' }, t('How sure are you?')),
      el('div', { class: 'conf' }, [['🤷', 'Guessing', 0], ['🤔', 'Think so', 1], ['💪', 'Sure', 2]].map(([e, lab, v]) => el('button', { onclick: () => sendAnswer(k, v) }, e, el('br'), t(lab)))),
      el('p', { class: 'muted', style: 'font-size:13px;margin:10px 0 0' }, t('Sure and right = more points. Sure and wrong = lose a few.')),
      el('button', { class: 'go', style: 'background:var(--panel2);color:var(--ink)', onclick: () => { pending = null; render(view); } }, t('Change my answer'))); }
  function bossBar(b) { return el('div', { class: 'card', style: 'padding:10px 14px' }, el('div', { style: 'display:flex;justify-content:space-between;font-weight:800' }, el('span', {}, '🦠 ' + t('Boss')), el('span', {}, Math.max(0, Math.round(b.hp / b.max * 100)) + '%')), el('div', { class: 'hp' }, el('i', { style: 'width:' + (b.hp / b.max * 100) + '%' }))); }
  const PW = { double: ['✖2', t('Double points')], fifty: ['½', '50/50'], freeze: ['⏸', t('Time freeze')], shield: ['🛡', t('Streak shield')] };
  function powers(d, done) { if (!d.pw || (!d.pw.length && !d.used)) return '';
    if (d.used) return el('div', { class: 'pws' }, el('button', { class: 'pw used', disabled: '' }, PW[d.used][0] + ' ' + PW[d.used][1] + ' ' + t('on')));
    return el('div', { class: 'pws' }, d.pw.map(k => el('button', { class: 'pw', disabled: done ? '' : null, onclick: async () => { const r = await post('power', { pid, qi: d.qi, k }).catch(() => null); if (r && !r.ok) { m.append(el('p', { class: 'err center' }, r.j.error)); } } }, PW[k][0] + ' ' + PW[k][1]))); }
  function resBox(r) { return r.ok ? el('div', { class: 'res ok' }, el('div', { class: 'big' }, '✓'), el('h2', {}, t('Correct!') + ' +' + r.pts), r.streak > 1 ? el('div', {}, '🔥 ' + r.streak + ' ' + t('in a row')) : '', r.use === 'double' ? el('div', {}, '✖2 ' + t('double points!')) : '', r.got ? el('div', { style: 'margin-top:6px;font-weight:800;color:#FFC928' }, '⚡ ' + t('New power-up:') + ' ' + PW[r.got][1]) : '')
      : el('div', { class: 'res no' }, el('div', { class: 'big' }, '✗'), el('h2', {}, t('Not this time') + (r.pts < 0 ? ' (' + r.pts + ')' : '')), r.conf === 2 ? el('div', {}, t('You were sure — check the answer below carefully.')) : '', r.use === 'shield' ? el('div', {}, '🛡 ' + t('Your streak is safe')) : ''); }
  function rightCard(d) { if (d.order) return el('div', { class: 'card' }, el('div', { class: 'muted' }, t('The right order')), el('div', { class: 'ord', style: 'margin-top:8px' }, d.order.map((o, i) => el('div', { class: 'it' + (Array.isArray(d.mine) ? (d.mine[i] === i ? ' ok' : ' no') : '') }, el('span', { class: 'n' }, i + 1), el('span', { class: 'tx' }, o)))), d.ex ? el('div', { class: 'muted', style: 'margin-top:6px' }, d.ex) : '');
    return el('div', { class: 'card' }, el('div', { class: 'muted' }, t('The answer')), el('b', {}, L[d.a] + ') ' + d.o[d.a]), d.ex ? el('div', { class: 'muted', style: 'margin-top:6px' }, d.ex) : ''); }
  /* "put in order": drag the cards (or use the arrows), then Submit */
  let ordState = null;
  function orderList(d, done) {
    if (!ordState || ordState.qi !== d.qi) ordState = { qi: d.qi, list: d.oi.map((k, i) => ({ k, t: d.o[i] })) };
    const L2 = ordState.list, box = el('div', { class: 'ord' });
    const draw = () => box.replaceChildren(...L2.map((it, i) => { const row = el('div', { class: 'it' }, el('span', { class: 'n' }, i + 1), el('span', { class: 'tx' }, it.t),
      done ? '' : el('button', { onclick: () => { if (i > 0) { [L2[i - 1], L2[i]] = [L2[i], L2[i - 1]]; draw(); } } }, '▲'), done ? '' : el('button', { onclick: () => { if (i < L2.length - 1) { [L2[i + 1], L2[i]] = [L2[i], L2[i + 1]]; draw(); } } }, '▼'));
      if (!done) row.onpointerdown = e => { if (e.target.closest('button')) return; e.preventDefault(); row.setPointerCapture(e.pointerId); row.classList.add('drag'); const y0 = e.clientY, h = row.offsetHeight + 8; let cur = i;
        row.onpointermove = ev => { const dy = ev.clientY - y0; row.style.transform = 'translateY(' + dy + 'px)'; const to = Math.max(0, Math.min(L2.length - 1, i + Math.round(dy / h))); cur = to; };
        row.onpointerup = row.onpointercancel = () => { row.onpointermove = row.onpointerup = row.onpointercancel = null; const [x] = L2.splice(i, 1); L2.splice(cur, 0, x); draw(); }; };
      return row; }));
    draw(); if (done) return box;
    return el('div', {}, box, el('button', { class: 'go', onclick: () => { const c = L2.map(x => x.k); if (view.conf) { pending = { qi: d.qi, c }; render(view); } else sendAnswer(c, null); } }, t('Submit my order'))); }
  const ordinal = n => LANG === 'ar' ? String(n) : n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  /* arriving from the class link: join with the same name, without typing; afterwards go back to the class */
  async function autoJoin() { set(el('div', { class: 'center' }, el('h1', {}, t('Joining the quiz…')), el('div', { class: 'dots' }, el('i'), el('i'), el('i'))));
    try { const r = await post('join', { pin, name: autoName }); if (r.ok) { pid = r.j.pid; try { localStorage.setItem(key, pid); } catch (e) {} connect(); return; } joinScreen(t(r.j.error || 'Could not join.')); } catch (e) { joinScreen(t('Cannot reach the board — are you on the school Wi-Fi?')); } }
  if (pid) connect(); else if (autoName) autoJoin(); else joinScreen();
})();
