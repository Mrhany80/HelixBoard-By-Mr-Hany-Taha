<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="hbBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F4A2C"/><stop offset=".55" stop-color="#08311D"/><stop offset="1" stop-color="#041A10"/></linearGradient>
    <linearGradient id="hbRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5C542"/><stop offset=".5" stop-color="#FFE08A"/><stop offset="1" stop-color="#3DBE6B"/></linearGradient>
    <linearGradient id="hbPen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#136B3E"/><stop offset=".55" stop-color="#1F9A56"/><stop offset="1" stop-color="#3DBE6B"/></linearGradient>
    <linearGradient id="hbCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8F3E2"/></linearGradient>
    <linearGradient id="hbInk" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#9BF2B8"/><stop offset=".5" stop-color="#3DBE6B"/><stop offset="1" stop-color="#F5C542"/></linearGradient>
    <radialGradient id="hbHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>
    <filter id="hbGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hbClip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
    <filter id="hbShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#hbBg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="url(#hbRim)" stroke-width="3" stroke-opacity=".75"/>
  <g clip-path="url(#hbClip)">
  <!-- the helix -->
  <g filter="url(#hbGlow)" stroke-linecap="round" transform="translate(-2 10) scale(.76)">
    <g stroke-width="11">
      <line x1="98" y1="60" x2="158" y2="60" stroke="#FFFFFF"/>
      <line x1="110" y1="110" x2="146" y2="110" stroke="#F5C542"/>
      <line x1="94" y1="128" x2="162" y2="128" stroke="#FFFFFF"/>
      <line x1="110" y1="146" x2="146" y2="146" stroke="#F5C542"/>
      <line x1="98" y1="196" x2="158" y2="196" stroke="#FFFFFF"/>
    </g>
    <path d="M78 36c0 64 100 64 100 92s-100 28-100 92" fill="none" stroke="#F5C542" stroke-width="17"/>
    <path d="M178 36c0 64-100 64-100 92s100 28 100 92" fill="none" stroke="#3DBE6B" stroke-width="17"/>
  </g>
  <!-- the stroke the smart pen draws -->
  <path d="M147 178C122 206 84 196 44 220" fill="none" stroke="url(#hbInk)" stroke-width="9" stroke-linecap="round" filter="url(#hbGlow)"/>
  <!-- the smart pen -->
  <g transform="translate(184 116) rotate(32)" filter="url(#hbShadow)">
    <path d="M-15 36L15 36L4 70L-4 70Z" fill="url(#hbCone)"/>
    <rect x="-16" y="-80" width="32" height="118" rx="16" fill="url(#hbPen)"/>
    <rect x="-16" y="-88" width="32" height="20" rx="10" fill="#F5C542"/>
    <rect x="-16" y="12" width="32" height="20" fill="#0B2E1B"/>
    <path d="M-16 17h32M-16 22h32M-16 27h32" stroke="#1C4D31" stroke-width="1.6"/>
    <rect x="-9" y="-64" width="5" height="62" rx="2.5" fill="#FFFFFF" opacity=".35"/>
    <rect x="16" y="-44" width="5" height="20" rx="2.5" fill="#F5C542"/>
    <circle cx="0" cy="-26" r="6.5" fill="#FFE08A"/>
    <circle cx="0" cy="-26" r="12" fill="url(#hbHalo)" opacity=".7"/>
  </g>
  <circle cx="147" cy="177" r="13" fill="url(#hbHalo)"/>
  <circle cx="147" cy="177" r="4.5" fill="#FFFBEA"/>
  <!-- sparkles -->
  <path d="M196 196l3.2 8.8 8.8 3.2-8.8 3.2-3.2 8.8-3.2-8.8-8.8-3.2 8.8-3.2z" fill="#F5C542"/>
  <path d="M120 160l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z" fill="#FFFFFF" opacity=".85"/>
  </g>
</svg>
