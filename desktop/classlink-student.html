<!doctype html>
<html lang="__LANG__" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A14">
<title>__TITLE__ · HelixBoard</title>
<style>
  :root { --bg:#120A14; --panel:#1C1220; --panel2:#271A2C; --line:#3A2840; --ink:#F6ECF4; --muted:#B9A5B6; --accent:#FF5FA2; --ok:#4ADE80; --bad:#FF6B6B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Tahoma, Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  nav { display: flex; gap: 6px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: inherit; font: 600 14px inherit; font-family: inherit; position: relative; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #24020F; }
  nav button .dot { position: absolute; top: 5px; inset-inline-end: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
  .center { margin: auto 0; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 6px; } h2 { font-size: 20px; margin: 0; line-height: 1.35; }
  .muted { color: var(--muted); }
  input { width: 100%; height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: inherit; font: 600 19px inherit; font-family: inherit; padding: 0 14px; margin: 6px 0; text-align: center; }
  input:focus { outline: none; border-color: var(--accent); }
  .go { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: #24020F; font: 800 19px inherit; font-family: inherit; margin-top: 8px; }
  .go:disabled { opacity: .5; }
  .btn { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: inherit; font: 600 15px inherit; font-family: inherit; padding: 0 14px; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #24020F; }
  .err { color: var(--bad); min-height: 22px; margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .boardwrap { position: relative; background: #fff; border-radius: 12px; overflow: hidden; touch-action: pan-x pan-y pinch-zoom; }
  .boardwrap img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .boardwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .boardwrap.view canvas { pointer-events: none; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .file { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .file .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--panel2); display: grid; place-items: center; font-size: 22px; flex: none; }
  .opts { display: grid; gap: 10px; }
  .opt { border: 2px solid var(--line); border-radius: 14px; background: var(--panel2); color: inherit; font: 600 17px inherit; font-family: inherit; padding: 14px; text-align: start; display: flex; gap: 12px; align-items: center; }
  .opt .lt { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; color: #1E1419; flex: none; }
  .opt.on { border-color: var(--accent); background: #3A1530; }
  .opt.right { border-color: var(--ok); } .opt.wrong { border-color: var(--bad); }
  .bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
  .big { font: 900 56px system-ui, sans-serif; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px; }
  #off { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; border-radius: 12px; background: #5A1E28; color: #fff; text-align: center; font-weight: 600; display: none; }
  [dir=rtl] .opt { text-align: right; }
  .hbtn { height: 34px; min-width: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: inherit; font: 600 14px inherit; font-family: inherit; padding: 0 9px; }
  .hbtn.on { background: #FFC928; color: #241a00; border-color: #FFC928; }
  .stars { font-weight: 800; color: #FFC928; white-space: nowrap; }
  .prompt { font: 700 20px/1.35 system-ui, sans-serif; }
  .clock { font: 800 15px ui-monospace, monospace; color: #FFC928; }
  .pad { position: relative; background: #fff; border-radius: 14px; overflow: hidden; touch-action: none; box-shadow: 0 0 0 1px var(--line); }
  .pad img, .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pad img { object-fit: contain; pointer-events: none; }
  .pad.off { opacity: .75; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sz { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; padding: 0; }
  .sz i { display: block; border-radius: 50%; background: var(--ink); }
  .sz.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  textarea { width: 100%; min-height: 110px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: inherit; font: 500 17px/1.4 inherit; font-family: inherit; padding: 12px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
  .note { border-radius: 12px; padding: 12px 14px; color: #1E1419; font-weight: 600; position: relative; word-break: break-word; }
  .note button { position: absolute; top: 4px; inset-inline-end: 4px; border: 0; background: rgba(0,0,0,.12); border-radius: 8px; width: 28px; height: 28px; }
  .ok { color: var(--ok); font-weight: 700; }
  .shared { border-color: #FFC928; }
  .shared .who { color: #FFC928; font-weight: 800; font-size: 14px; }
  #lockv { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
  #lockv .big { font-size: 80px; }
  #lockv img { max-width: 100%; max-height: 62vh; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #lockv.withboard .big { font-size: 40px; } #lockv.withboard h1 { font-size: 20px; margin: 0; }
  #tray { position: fixed; top: 58px; right: 10px; z-index: 26; display: none; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #tray.on { display: flex; } #tray button { font-size: 26px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; transition: transform .12s; } #tray button:active { transform: scale(1.3); }
  #tray button.sent { animation: pop .5s; } @keyframes pop { 50% { transform: scale(1.45) translateY(-6px); } }
  #sheetq { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 16px; display: none; }
  .opt .pc { margin-inline-start: auto; font-weight: 800; }
  .cdbar { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin: 8px 0 6px; display: none; }
  .cdbar i { display: block; height: 100%; background: linear-gradient(90deg, #FF5FA2, #22D3EE); transition: width .25s linear; }
  .cdbar.hurry i { background: var(--bad); }
  .clock.hurry { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .opt:disabled { opacity: 1; }
</style>
</head>
<body>
<header><b id="hd">__TITLE__</b><span id="stars" class="stars"></span><span id="me"></span><span id="lvl" class="stars"></span><button class="hbtn" id="reactB" hidden title="React">😊</button><button class="hbtn" id="handB" hidden title="Raise hand">✋</button><button class="hbtn" id="askB" hidden title="Ask a question">?</button></header>

<div id="off"></div>

<script>

, 'Your full name': 'اسمك الكامل', 'Please write your full name — first name and last name.': 'يرجى كتابة اسمك الكامل — الاسم الأول واسم العائلة.', 'Write your first and last name so your teacher knows who you are.': 'اكتب اسمك الأول واسم عائلتك ليعرفك معلمك.', 'Lv': 'مستوى', 'Tap the picture': 'المس الصورة', 'Put in order': 'رتّب', 'Tap the right place on the picture.': 'المس المكان الصحيح على الصورة.', 'Tap the picture first.': 'المس الصورة أولاً.', 'Drag the cards into the right order.': 'اسحب البطاقات إلى الترتيب الصحيح.', 'Put the cards in order first.': 'رتّب البطاقات أولاً.', 'React': 'تفاعل', 'Look at the board — your teacher is explaining.': 'انظر إلى السبورة — معلمك يشرح الآن.', 'The live session has ended': 'انتهت الحصة المباشرة' };
  const t = s => LANG === 'ar' && AR[s] ? AR[s] : s;
  if (LANG === 'ar') document.documentElement.dir = 'rtl';
  const NOTE_C = ['#FFE066', '#FFA8C5', '#A5D8FF', '#B2F2BB', '#FFC078', '#D0BFFF'];
  const C = ['#FF5FA2', '#22D3EE', '#FFC928', '#4ADE80', '#B197FC', '#FF9F5A'], L = 'ABCDEF';
  const m = document.getElementById('m'), nav = document.getElementById('nav'), off = document.getElementById('off'), q = new URLSearchParams(location.search);
  const pin = q.get('pin') || '', key = 'hbcl:' + pin;
  let pid = null, me = null, st = null, tab = 'board', ver = 0, loopId = 0, hwRun = null;
  try { const s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) { pid = s.pid; me = s; } } catch (e) {}
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); Object.entries(attrs || {}).filter(([k, v]) => v != null).forEach(([k, v]) => k === 'class' ? e.className = v : k.startsWith('on') ? e[k] = v : e.setAttribute(k, v)); kids.flat().forEach(k => e.append(k && k.nodeType ? k : document.createTextNode(k == null ? '' : String(k)))); return e; };
  const set = (...kids) => m.replaceChildren(...kids);
  const post = (p, d) => fetch(p + '?pid=' + encodeURIComponent(pid || ''), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).then(r => r.json().then(j => ({ ok: r.ok, j })));

  function joinScreen(msg) {
    nav.hidden = true;
    const name = el('input', { maxlength: '40', placeholder: t('Your full name'), autocomplete: 'off', autocapitalize: 'words' });
    const pinIn = el('input', { inputmode: 'numeric', maxlength: '6', placeholder: t('PIN') }); pinIn.value = pin;
    const err = el('div', { class: 'err' }, msg || ''), go = el('button', { class: 'go' }, t('Join'));
    const submit = async () => { go.disabled = true; err.textContent = ''; try { const r = await fetch('/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pinIn.value.trim(), name: name.value }) }).then(r => r.json().then(j => ({ ok: r.ok, j }))); if (!r.ok) { err.textContent = t(r.j.error || 'Could not join.'); go.disabled = false; return; } pid = r.j.pid; me = r.j; try { localStorage.setItem(key, JSON.stringify(me)); } catch (e) {} connect(); } catch (e) { err.textContent = t('Cannot reach the board — check your connection.'); go.disabled = false; } };

  }

  /* ---------- live board, with a pen when the teacher allows writing ---------- */
  let bw = null, img = null, cv = null, mode = 'view', color = null, mine = [];
  function boardView(prev) {
